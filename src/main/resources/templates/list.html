<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Liste des clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Custom CSS -->
    <style>
        /* Body background */
        body {
            background-color: #f0f4f8; /* light blue-gray */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container styling */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* Headings */
        h2 {
            color: #0d6efd;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Search input */
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13,110,253,0.3);
        }

        /* Buttons */
        .btn-primary {
            border-radius: 8px;
            background-color: #0d6efd;
            border-color: #0d6efd;
            transition: all 0.3s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            color: #fff;
        }

        .btn-warning {
            border-radius: 6px;
            transition: all 0.3s ease-in-out;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            color: #fff;
        }

        .btn-danger {
            border-radius: 6px;
            transition: all 0.3s ease-in-out;
        }
        .btn-danger:hover {
            background-color: #c82333;
            color: #fff;
        }

        /* Table styling */
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #e9ecef;
        }

        .table-dark {
            background-color: #343a40;
            color: #fff;
        }

        /* Shadow for table */
        .table {
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body class="p-4 bg-light">

<div class="container">

    <h2 class="mb-4">Liste des clients</h2>

    <!-- Barre recherche -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <!-- Recherche à gauche -->
        <form class="d-flex" th:action="@{/clients}" method="get">
            <input class="form-control me-2" type="search" placeholder="Rechercher par nom"
                   name="q" th:value="${q}" />
            <button class="btn btn-outline-primary" type="submit">Rechercher</button>
        </form>

        <!-- Boutons à droite -->
        <div class="d-flex gap-2">
            <!-- Ajouter visible seulement pour ADMIN -->
            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
               class="btn btn-primary"
               th:href="@{/clients/add}">
                Ajouter un client
            </a>

            <!-- Logout pour tous -->
            <form th:action="@{/logout}" method="post" style="display:inline-block">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-secondary">Logout</button>
            </form>
        </div>

    </div>

    <!-- Tableau -->
    <table class="table table-striped table-bordered shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Âge</th>
            <th th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="client : ${clients}">
            <td th:text="${client.id}"></td>
            <td th:text="${client.nom}"></td>
            <td th:text="${client.age}"></td>

            <!-- Colonne actions visible seulement ADMIN -->
            <td th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

                <!-- Modifier -->
                <a th:href="@{/clients/edit/{id}(id=${client.id})}"
                   class="btn btn-sm btn-warning me-1">
                    Modifier
                </a>

                <!-- Supprimer via POST + CSRF -->
                <form th:action="@{/clients/delete/{id}(id=${client.id})}"
                      method="post"
                      style="display:inline-block">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Supprimer ce client ?')">
                        Supprimer
                    </button>
                </form>

            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
