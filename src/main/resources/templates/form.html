<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Formulaire client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Custom CSS -->
    <style>
        /* Body background */
        body {
            background-color: #f0f4f8; /* light blue-gray */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container styling */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* Headings */
        h3 {
            color: #0d6efd;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Form inputs */
        .form-control {
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #ced4da;
            transition: all 0.3s ease-in-out;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13,110,253,0.3);
        }

        /* Buttons */
        .btn-success {
            background-color: #0d6efd;
            border-color: #0d6efd;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .btn-success:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            color: #fff;
        }

        /* Error messages */
        .text-danger {
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body class="p-4">
<div class="container">
    <h3 th:text="${client.id} != null ? 'Modifier client' : 'Ajouter client'">Formulaire</h3>

    <form th:action="@{/clients/save}" th:object="${client}" method="post" class="w-50">

        <!-- 🔐 Token CSRF requis par Spring Security -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" th:field="*{nom}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Âge</label>
            <input type="number" th:field="*{age}" class="form-control" min="1"/>
            <div class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
        </div>

        <button class="btn btn-success" type="submit">Enregistrer</button>
        <a class="btn btn-secondary" th:href="@{/clients}">Annuler</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
